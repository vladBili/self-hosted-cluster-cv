apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: pyspark-job
spec:
  type: Python
  pythonVersion: 3
  mode: cluster
  image:  "registry.gitlab.com/vladbilii/self-hosted-cluster-cv:6178aedcd15039520f1ec2e2982ea7c53cec5e1b"
  mainApplicationFile: "local:///opt/spark/test-image/main.py" 
  driver:
    cores: 1
    memory: "1g"
  executor:
    cores: 1
    memory: "1g"
    instances: 2