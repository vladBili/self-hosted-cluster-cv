---
- name: Kubernetes
  hosts: localhost
  environment:
    KUBECONFIG: "{{ directory }}/IAM/kubernetes/env/{{ department }}/config/admin.conf"
  tasks:
    - name: Label nodes
      ansible.builtin.command:
        cmd: kubectl label node {{ item }} node-role.kubernetes.io/worker=
      loop: "{{ groups['worker'] }}"

    - name: Deploy CNI
      ansible.builtin.shell: |
        helm repo add eks https://aws.github.io/eks-charts || true
        helm repo update
        helm upgrade --install aws-vpc-cni eks/aws-vpc-cni \
        --namespace kube-system \
        --version 1.20.0 \
        --set env.ENABLE_PREFIX_DELEGATION=true \
        --set env.NETWORK_POLICY_ENFORCING_MODE=standard

    - name: Deploy CCM
      ansible.builtin.shell: |
        kubectl apply -k https://github.com/kubernetes/cloud-provider-aws//examples/existing-cluster/base?ref=master

    - name: Deploy ArgoCD
      vars:
        cp_count: "{{ groups['controlplane'] | length }}"
        ha_enabled: "{{ 'true' if department == 'production' else 'false' }}"
      ansible.builtin.shell: |
        helm repo add argo https://argoproj.github.io/argo-helm || true
        helm repo update
        helm upgrade --install argocd argo/argo-cd \
          --create-namespace \
          --namespace argocd \
          --set redis-ha.enabled={{ ha_enabled }} \
          --set controller.replicas={{ cp_count }} \
          --set server.replicas={{ cp_count }} \
          --set repoServer.replicas={{ cp_count }} \
          --set applicationSet.replicas={{ cp_count }}

    - name: Deploy argocd projects
      ansible.builtin.shell: |
        kubectl apply -f "{{ directory }}/IAM/argocd/{{ department }}/projects"

    - name: Deploy applications
      ansible.builtin.shell: |
        kubectl apply -k "{{ directory }}/IAM/kubernetes/overlays/{{ department }}"
