apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: development
  source:
    repoURL: https://github.com/vladBili/self-hosted-cluster-cv.git
    targetRevision: main 
    path: IAM/kubernetes/base/nginx/kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true