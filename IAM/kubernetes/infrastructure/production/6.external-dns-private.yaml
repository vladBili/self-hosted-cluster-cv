apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-private
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://gitlab.com/vladbilii/self-hosted-cluster-cv.git
    targetRevision: main
    path: IAM/kubernetes/components/external-dns/overlays/production/private
  ignoreDifferences:
  - group: ""
    kind: ServiceAccount
    name: external-dns-private
    namespace: external-dns
    jsonPointers:
    - /metadata/annotations/eks.amazonaws.com~1role-arn
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true