apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-vpc-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infrastructure
  source:
    repoURL: https://gitlab.com/vladbilii/self-hosted-cluster-cv.git
    targetRevision: main
    path: IAM/kubernetes/components/aws-vpc-cni/overlays/production/
  ignoreDifferences:
  - group: ""
    kind: ServiceAccount
    name: aws-node
    namespace: kube-system
    jsonPointers:
    - /metadata/annotations/eks.amazonaws.com~1role-arn
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true