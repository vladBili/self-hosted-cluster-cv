apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-component
  namespace: fastapi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: "registry.gitlab.com/vladbilii/self-hosted-cluster-cv:5d6f6d3c3f93b2121f2fd269e1fcaa458e1e6fd4"
          command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8080']
          ports:
            - name: http
              containerPort: 8080
