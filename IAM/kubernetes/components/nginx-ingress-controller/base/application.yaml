apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-component
  namespace: argocd
spec:
  project: infrastructure
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.13.0
    - repoURL: https://github.com/vladBili/self-hosted-cluster-cv.git
      targetRevision: feature/airflow-deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true