apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-component
  namespace: argocd
spec:
  project: infrastructure
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision:  0.20.1
    - repoURL: https://github.com/vladBili/self-hosted-cluster-cv.git
      targetRevision: feature/airflow-deploy
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true