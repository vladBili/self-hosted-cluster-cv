apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-deployment
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: nginx
spec:
  project: development
  sources:
    - repoURL: https://github.com/vladBili/self-hosted-cluster-cv.git
      targetRevision: main
      path: IAM/kubernetes/base/nginx
  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
    syncOptions:
      - CreateNamespace=true